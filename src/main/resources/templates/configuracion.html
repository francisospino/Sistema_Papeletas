<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Configuraci&oacute;n - Notificaciones</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div th:replace="~{fragments :: cabecera}"></div>

    <main>
        <div th:if="${mensaje}" class="mensaje-ok" th:text="${mensaje}"></div>
        <div th:if="${error}" class="mensaje-error" th:text="${error}"></div>

        <div class="tarjeta">
            <h2 style="margin-top:0;">Correos que reciben la notificaci&oacute;n</h2>
            <p style="font-size:0.85rem;color:#667;">
                Cada vez que se registra una papeleta nueva, se env&iacute;a un correo autom&aacute;tico
                a todos los destinatarios de esta lista.
            </p>

            <form method="post" th:action="@{/configuracion/destinatarios}" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:18px;">
                <div class="campo" style="flex:1;">
                    <label for="email">Agregar correo</label>
                    <input type="email" id="email" name="email" placeholder="correo@tuempresa.com" required>
                </div>
                <button type="submit">
                    <svg class="icono" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    Agregar
                </button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Correo</th>
                        <th style="width:1%;white-space:nowrap;">Acci&oacute;n</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(destinatarios)}">
                        <td colspan="2" class="fila-vacia">
                            <svg class="icono-vacio" viewBox="0 0 24 24"><path d="M3 7l9 6 9-6M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></svg>
                            <span>A&uacute;n no hay correos registrados. Nadie recibir&aacute; notificaciones hasta que agregues alguno.</span>
                        </td>
                    </tr>
                    <tr th:each="d : ${destinatarios}">
                        <td th:text="${d.email}"></td>
                        <td>
                            <form method="post" th:action="@{/configuracion/destinatarios/{id}/eliminar(id=${d.id})}"
                                  onsubmit="return confirm('¿Quitar este correo de la lista de notificaciones?');">
                                <button type="submit" class="secundario">
                                    <svg class="icono" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
                                    Quitar
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments :: pie}"></div>
</body>
</html>
