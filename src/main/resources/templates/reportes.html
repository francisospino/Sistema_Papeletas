<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes de papeletas</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div th:replace="~{fragments :: cabecera}"></div>

    <main>
        <div class="tarjeta">
            <h2 style="margin-top:0;">Bienes actualmente fuera (traslado temporal sin retorno)</h2>
            <table>
                <thead>
                    <tr>
                        <th>N&deg;</th>
                        <th>Destino</th>
                        <th>Responsable</th>
                        <th>Fecha salida</th>
                        <th>Retorno estimado</th>
                        <th>D&iacute;as fuera</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pendientesRetorno)}">
                        <td colspan="6">No hay bienes pendientes de retorno.</td>
                    </tr>
                    <tr th:each="p : ${pendientesRetorno}">
                        <td th:text="${p.numero}"></td>
                        <td th:text="${p.destinoBien}"></td>
                        <td th:text="${p.responsableSolicitante}"></td>
                        <td th:text="${p.fechaSalida}"></td>
                        <td th:text="${p.fechaRetornoEstimada != null ? p.fechaRetornoEstimada : '-'}"></td>
                        <td th:text="${T(java.time.temporal.ChronoUnit).DAYS.between(p.fechaSalida, T(java.time.LocalDate).now())}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="tarjeta">
            <h2 style="margin-top:0;">Papeletas por destino</h2>
            <table>
                <thead>
                    <tr><th>Destino</th><th>Total</th></tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${porDestino}">
                        <td th:text="${c.etiqueta}"></td>
                        <td th:text="${c.total}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="tarjeta">
            <h2 style="margin-top:0;">Papeletas por &aacute;rea que autoriza</h2>
            <table>
                <thead>
                    <tr><th>&Aacute;rea</th><th>Total</th></tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${porArea}">
                        <td th:text="${c.etiqueta}"></td>
                        <td th:text="${c.total}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments :: pie}"></div>
</body>
</html>
