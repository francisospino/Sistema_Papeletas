# Servidor: escucha en todas las interfaces de red para que otros equipos de la LAN
# puedan acceder via http://<ip-de-esta-pc>:8080
server.address=0.0.0.0
server.port=8080

# Base de datos MySQL (server central en la LAN)
# Se usa 127.0.0.1 en vez de "localhost" porque en Windows "localhost" a veces resuelve a
# IPv6 (::1) y XAMPP/MySQL por defecto solo escucha en IPv4, causando "Connection refused"
# aunque MySQL este corriendo.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/papeletas_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Correo (Gmail SMTP con App Password de 16 digitos: https://myaccount.google.com/apppasswords)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Destinatarios que reciben la notificacion cada vez que se registra una papeleta
# (lista separada por comas)
papeletas.notificacion.destinatarios=${NOTIFICACION_DESTINATARIOS:}
papeletas.notificacion.habilitada=${NOTIFICACION_HABILITADA:true}
